# Experiment settings
base_config: neumeta/config/base_config.yaml

# Model configurations
model:
  type: ResNet20
  pretrained_path: neumeta/pretrained_models/cifar10_resnet20-4118986f.pt   # Path to pre-trained model
  smooth: False

experiment:
  name: ${model.type}_Debug
  num_epochs: 200
  log_interval: 200
  eval_interval: 1
  seed: 42  # Random seed


# Training configurations
training:
  optimizer: adam
  learning_rate: 1e-3
  batch_size: 128
  coordinate_noise: 1.0
  #lr_steps: [100, 150]
  scheduler: cosine
  T_max: 200
  weight_decay: 1e-2
  clip_grad: 10.0
  save_model_path: experiments/${experiment.name} # Directory to save the trained model

# Hyper-model specifications (specific to NeRF)
hyper_model:
  type: resmlp
  input_dim: 6
  hidden_dim: 512
  num_layers: 8
  num_freqs: 32
  output_dim: 9
  ema_decay: 0.995  # Exponential moving average decay
  
  loss_weight:
    ce_weight: 1.0
    reg_weight: 0.01
    recon_weight: 1.0
    kd_weight: 0.1

# Experiment dimensions configuration
dimensions:
  range: [32, 64]  # Dimension range for the experiment
  test: 32  # Testing dimension
  norm: 64  # Normalization factor
  start: 64  # Starting dimension