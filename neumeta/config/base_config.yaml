# Experiment settings
experiment:
  name: ninr_resnet20_cifar10_32-64-4layer-5
  recononly: 0
  num_epochs: 30
  debug: False
  log_interval: 250
  eval_interval: 1
  arch_accumulation_steps: 1
  batch_accumulation_steps: 1
  seed: 42  # Random seed
  iterative: False
  convertToDdp: False
  scaler: False
  custom_init: False

# Model configurations
model:
  type: ResNet20
  pretrained_path: neumeta/pretrained_models/cifar10_resnet20-4118986f.pt  # Path to pre-trained model
  num_param: 1
  bottom_up: True
  smooth: True
  fuse: True
  single_block: False

# Training configurations
training:
  learning_rate: 1e-3
  eta_min: 5e-4
  batch_size: 64
  coordinate_noise: 0.0
  #lr_steps: [100, 150]
  weight_decay: 1e-2
  clip_grad: 10.0
  save_model_path: neumeta/experiments/resnet20_cifar10_32-64-4layer-5 # Directory to save the trained model

# Hyper-model specifications (specific to NeRF)
hyper_model:
  input_dim: 6
  hidden_dim: 256
  num_layers: 4
  num_freqs: 16
  output_dim: 9
  #ema_decay: 0.995  # Exponential moving average decay

  loss_weight:
    ce_weight: 1.0
    reg_weight: 0.0001
    recon_weight: 1.0
    kd_weight: 0.1

# Experiment dimensions configuration
dimensions:
  range: [32, 64]  # Dimension range for the experiment
  test: 32  # Testing dimension
  norm: 64  # Normalization factor
  start: 64  # Starting dimension
