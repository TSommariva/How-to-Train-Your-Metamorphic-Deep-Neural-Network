# Experiment settings
# Experiment settings
base_config: neumeta/config/base_config.yaml
# Model configurations
model:
  type: ResNet56
  pretrained_path: neumeta/pretrained_models/cifar100_ResNet56-smoothed.pt
  num_param: 1
  smooth: False
  fuse: False

experiment:
  name: CIFAR100_${model.type}_${experiment.num_epochs}e_SmallBottleneck_${model.num_param}Learnable_1Slim
  debug: False
  num_epochs: 400
  log_interval: 100
  eval_interval: 1


# Training configurations
training:
  learning_rate: 1e-3
  batch_size: 128
  coordinate_noise: 1.0
  scheduler: cosine
  T_max: 200
  # strong_aug: v1
  weight_decay: 1e-2
  clip_grad: 10.0
  save_model_path: experiments/${experiment.name} # Directory to save the trained model

# Hyper-model specifications (specific to NeRF)
hyper_model:
  type: resmlp
  input_dim: 6
  hidden_dim: 512
  num_layers: 8
  num_freqs: 32
  output_dim: 9
  ema_decay: 0.995  # Exponential moving average decay

  loss_weight:
    ce_weight: 100.0
    reg_weight: 0.001
    recon_weight: 1.0
    kd_weight: 0.1


# Experiment dimensions configuration
dimensions:
  range: [32, 64]  # Dimension range for the experiment
  test: 32  # Testing dimension
  norm: 64  # Normalization factor
  start: 64  # Starting dimension
