# Experiment settings
# Experiment settings
base_config: neumeta/config/base_config.yaml
# Model configurations
model:
  type: ResNet56
  pretrained_path: neumeta/pretrained_models/cifar100_ResNet56-smoothed.pt
  num_param: 8 #Learnable Blocks
  bottom_up: True
  smooth: False
  fuse: False
  single_block: False

experiment:
  name: 4BatchAccumulation_Baseline #singleBlock${model.single_block}_${model.num_param}Blocks_${experiment.num_epochs}e_${experiment.arch_accumulation_steps}ArchAccumulationSteps_${experiment.batch_accumulation_steps}BatchAccumulationSteps_CustomInit${experiment.custom_init}
  debug: False
  num_epochs: 100
  log_interval: 26
  eval_interval: 10
  arch_accumulation_steps: 1
  batch_accumulation_steps: 4
  iterative: True
  custom_init: False

# Training configurations
training:
  learning_rate: 5e-4
  batch_size: 128
  coordinate_noise: 1.0
  scheduler: cosine
  T_max: 100
  weight_decay: 1e-4
  clip_grad: 10.0
  save_model_path: experiments/AaITERATIVE/${experiment.name} # Directory to save the trained model

# Hyper-model specifications (specific to NeRF)
hyper_model:
  type: resmlp
  input_dim: 6
  hidden_dim: 512
  num_layers: 8
  num_freqs: 32
  output_dim: 9
  ema_decay: 0.995  # Exponential moving average decay

  loss_weight:
    ce_weight: 100.0
    reg_weight: 0.001
    recon_weight: 1.0
    kd_weight: 0.1


# Experiment dimensions configuration
dimensions:
  range: [32, 64]  # Dimension range for the experiment
  test: 32  # Testing dimension
  norm: 64  # Normalization factor
  start: 64  # Starting dimension