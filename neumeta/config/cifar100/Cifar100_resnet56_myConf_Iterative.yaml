base_config: neumeta/config/base_config.yaml
# Model configurations
model:
  type: ResNet56
  pretrained_path: neumeta/pretrained_models/cifar100_ResNet56-smoothed.pt
  num_param: 7 
  start_block: 7 #8 #7
  first_meta_block: 1
  smooth: False
  fuse: False
  only_last: False
  metamorphic_block_type: 'skipInit' #'resize' 
  
# Experiment settings
experiment:
  name: lastBlock_${hyper_model.type}_${experiment.num_epochs}e_${model.metamorphic_block_type}_StartBlock${model.start_block}_CustmInit:${experiment.custom_init}_${experiment.batch_accumulation_steps}AccumulationSteps
  num_epochs: 350 #100 #350
  log_interval: 26
  eval_interval: 10
  batch_accumulation_steps: 4 #1
  simul_blocks: 8
  iterative: True
  custom_init: True  #False
  test: False
  test_path: ''

# Training configurations
training:
  batch_size: 128
  learning_rate: 8e-4
  eta_min: ${training.learning_rate}
  scheduler: warmup_cosine
  warmup_epochs: 20
  start_decay: 100
  T_max: ${experiment.num_epochs}
  weight_decay: 1e-4
  coordinate_noise: 1.0
  clip_grad: 10.0
  save_model_path: /work/tesi_tsommariva/experiments/Paper/${experiment.name} # Directory to save the trained model
  cls_optimizer: adamw
  cls_learning_rate: 0 #7e-5 #0
  alpha_learning_rate: 1e-4 #0
  backbone_learning_rate: 0 #1e-5 
  cls_weight_decay: 1e-2

# Hyper-model specifications (specific to NeRF)
hyper_model:
  type: resmlpDict #resmlp
  kernel_groups: 4
  input_dim: 6
  hidden_dim: 512
  num_layers: 8
  num_freqs: 32
  output_dim: 9
  scalar: 0.1
  use_ema: False
  ema_decay: 0.995  # Exponential moving average decay

  loss_weight:
    ce_weight: 100.0
    reg_weight: 0.001
    recon_weight: 1.0
    kd_weight: 0.1


# Experiment dimensions configuration
dimensions:
  range: [32, 64]  # Dimension range for the experiment
  test_range: [16, 64]  # Dimension range for testing
  test: 32  # Testing dimension
  norm: 64  # Normalization factor
  start: 64  # Starting dimension