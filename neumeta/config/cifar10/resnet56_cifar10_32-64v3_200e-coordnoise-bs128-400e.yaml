# Experiment settings
base_config: neumeta/config/base_config.yaml

# Model configurations
model:
  type: ResNet56
  pretrained_path: neumeta/pretrained_models/cifar10_resnet56-187c023a.pt  # Path to pre-trained model
  smooth: True

experiment:
  name: ${model.type}_myConf
  num_epochs: 400
  log_interval: 100
  eval_interval: 1
  seed: 42  # Random seed

# Training configurations
training:
  learning_rate: 1e-3
  batch_size: 128
  coordinate_noise: 1.0
  lr_steps: [100, 150]
  weight_decay: 1e-2
  clip_grad: 10.0
  save_model_path: experiments/${experiment.name} # Directory to save the trained model

# Hyper-model specifications (specific to NeRF)
hyper_model:
  input_dim: 6
  hidden_dim: 256
  num_layers: 4
  num_freqs: 16
  output_dim: 9
  ema_decay: 0.995  # Exponential moving average decay

# Experiment dimensions configuration
dimensions:
  range: [32, 64]  # Dimension range for the experiment
  test: 32  # Testing dimension
  norm: 64  # Normalization factor
  start: 64  # Starting dimension
