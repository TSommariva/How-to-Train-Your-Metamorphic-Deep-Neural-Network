base_config: neumeta/config/base_config.yaml
# Model configurations
model:
  type: ResNet56
  pretrained_path: neumeta/pretrained_models/cifar100_ResNet56-smoothed.pt
  num_param: 8 #Numero di residuali metamorfici in ogni layer
  start_block: 8  #primo residuale addestrato nella training strategy iterativa (num_param=start_block per training non iterativo)
  first_meta_block: 1 #Indice del primo residalue metarfico in ogni Layer (Se metti 0, bisogna settare anche training.cls_learning_rate per addestrare le projection shortcut separatamente)
  smooth: True #Se si usa una prior già smoothed, smooth = False 
  fuse: True #Se si usa una prior già smoothed, fuse = False 
  only_last: False
  metamorphic_block_type: 'resize' #'skipInit' per il coefficiente alpha che sostituisce la batch norm
  start_layer: 3
  
# Experiment settings
experiment:
  name: NeuMeta
  num_epochs: 350
  log_interval: 26
  eval_interval: 10
  batch_accumulation_steps: 1 #Questo lo tengo a 4
  arch_accumulation_steps: 1 #Queste sono eventuali accumulazioni sullo stesso batch, io lo tengo a 1
  simul_blocks: 8 #deprecato
  iterative: True #deprecato
  recononly: 0 #deprecato
  custom_init: False #True per la strategia di inizializzazione del training iterativo
  debug: False #True per non loggare su wandb
  test: False #True per skippare il training a fare solo il test
  test_path: ''
  seed: 42  # Random seed
  convertToDdp: False #deprecato
  scaler: False #deprecato
  all_layers_sim: True #Sempre True

# Training configurations
training:
  batch_size: 128
  learning_rate: 8e-4
  eta_min: ${training.learning_rate} #per cosine annealing scheduler
  scheduler: warmup_cosine
  warmup_epochs: 20
  start_decay: 100
  T_max: ${experiment.num_epochs}
  weight_decay: 1e-4
  coordinate_noise: 1.0
  clip_grad: 10.0
  save_model_path: # Directory to save the trained model
  cls_optimizer: adamw
  cls_learning_rate: 0 #7e-5 learning rate per classificatore, residuale 3.8 e projection shortcut 
  alpha_learning_rate: 0 #1e-4 lerning rate per gli alpha coefficient che sostituiscon i BN layers
  backbone_learning_rate: 0 #deprecato
  cls_weight_decay: 1e-2

# Hyper-model specifications (specific to NeRF)
hyper_model:
  type: resmlpDict 
  kernel_groups: 4 #deprecato
  input_dim: 6
  hidden_dim: 512
  num_layers: 8
  num_freqs: 32
  output_dim: 9
  scalar: 0.1
  use_ema: False
  ema_decay: 0.995  # Exponential moving average decay

  loss_weight:
    ce_weight: 100.0
    reg_weight: 0.001
    recon_weight: 1.0
    kd_weight: 0.1


# Experiment dimensions configuration
dimensions:
  range: [32, 64]  # Dimension range for the experiment
  test_range: [16, 64]  # Dimension range for testing
  test: 32  # Testing dimension
  norm: 64  # Normalization factor
  start: 64  # Starting dimension